<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat SPG - Capitão Tati</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
	
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
	<!-- dados.js (normas) e persona.js agora ficam no Worker tati-proxy, não no navegador -->

    <style>
        /* Estilo do Botão Flutuante */
        #chat-btn {
            position: fixed;
            top: 20px; /* ou bottom */
            right: 20px;
            background-color: #28a745; /* Verde Exército */
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Arial', sans-serif;
        }

        /* Estilo da Janela do Chat */
        #chat-window {
            display: none; /* Se colocar block, começa aberto */
            position: fixed;
            top: 80px;
            right: 20px;
			width: 90%;
			max-width: 90%;
            height: 620px;
			max-height: 90vh;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            flex-direction: column;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            border: 1px solid #ddd;
        }

        /* Cabeçalho do Chat */
        .chat-header {
            background-color: #1e7e34;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Área das Mensagens */
        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #f8f9fa;
        }

        /* Estilo das Bolhas de Mensagem */
        .message {
            margin-bottom: 10px;
            max-width: 80%;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.bot {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .message.user {
            background-color: #d1e7dd; /* Verde claro */
            color: #0f5132;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }

        /* Área de Input */
        .chat-input-area {
            padding: 10px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 5px;
            background: white;
        }
        #user-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }
        #send-btn {
            background: #1e7e34;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }
        
        /* Indicador de digitando */
        .typing {
            font-size: 12px;
            color: #888;
            margin-left: 10px;
            display: none;
        }

	/* Novo aviso de carregamento */
        #loading-docs { font-size: 12px; background: #fff3cd; color: #856404; padding: 5px; text-align: center; display: none;}
    </style>
</head>
<body>

    <button id="chat-btn" onclick="toggleChat()">
        <i class="bi bi-chat-dots-fill"></i> Falar com a Capitão Tati
    </button>

    <div id="chat-window">
        <div class="chat-header">
            <div>
                <strong>Capitão Tati Caiado Brasil</strong><br>
                <small>Adjunto 3 - SPG</small>
            </div>
            <button onclick="toggleChat()" style="background:none; border:none; color:white; cursor:pointer;">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        
        <div id="loading-docs">Lendo normas da EsAO... aguarde.</div>

        <div id="chat-messages">
            <div class="message bot">
                Sou a Capitão Tati, Adjunto 3 à SPG da EsAO. Em que posso ajudar com sua Pós-Graduação hoje?
            </div>
        </div>
        <div class="typing" id="typing-indicator">Capitão Tati está digitando...</div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Digite sua dúvida..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()"><i class="bi bi-send-fill"></i></button>
        </div>
    </div>

	<script>
        // A chave do Gemini NÃO fica mais aqui — está protegida como secret no
        // Worker (tati-proxy). As normas e a persona também ficam no Worker.
        // Após o deploy (npx wrangler deploy), cole aqui a URL do seu Worker:
        const WORKER_URL = "https://tati-proxy.pablo-pochmann.workers.dev/";

		let chatHistory = []; // itens no formato { role: "user"|"model", text }

	    function toggleChat() {
            const chatWindow = document.getElementById('chat-window');
            if (chatWindow.style.display === 'none' || chatWindow.style.display === '') {
                chatWindow.style.display = 'flex';
            } else {
                chatWindow.style.display = 'none';
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

		// FUNÇÃO DO CONTADOR REGRESSIVO
        function iniciarContagem(elementId) {
            let segundos = 30;
            const elemento = document.getElementById(elementId);
            const intervalo = setInterval(() => {
                segundos--;
                if (elemento) {
                    elemento.innerText = segundos;
                }

                if (segundos <= 0) {
                    clearInterval(intervalo);
                    if (elemento) {
                        elemento.innerText = "0 (Pronto! Pode repetir a pergunta, por favor?)";
                        elemento.style.color = "green"; // Fica verde quando libera
                    }
                }
            }, 1000); // Roda a cada 1000ms (1 segundo)
        }

		// SUBSTITUA PELOS SEUS DADOS REAIS
		const FORM_ID = "1FAIpQLSeYQ-3jESx__-hDBliid8cIOSZ0c6cFET6B6OaOofKdxP7IHQ"; 
		const ENTRY_PERGUNTA = "entry.742193664"; // Número da entrada da pergunta
		const ENTRY_RESPOSTA = "entry.243665627"; // Número da entrada da resposta

		async function logToGoogleSheets(pergunta, resposta) {
   		// Monta a URL de envio (usamos formResponse em vez de viewform)
    	const url = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`;
    
    	// Cria os dados do formulário
    	const formData = new FormData();
    	formData.append(ENTRY_PERGUNTA, pergunta);
    	formData.append(ENTRY_RESPOSTA, resposta);

    	try {
        	// Envia sem esperar resposta (mode: 'no-cors' é essencial aqui)
        	await fetch(url, {
            	method: "POST",
            	mode: "no-cors",
            	body: formData
        	});
        	console.log("Log enviado para o QG!");
    	} catch (e) {
        	console.error("Falha no log:", e);
    	}
	}
		
		//FUNÇÃO CHAT MESSAGE
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const messageText = input.value.trim();
            const messagesDiv = document.getElementById('chat-messages');
            const typingIndicator = document.getElementById('typing-indicator');

			let botResponse = "Desculpe, não consegui processar a resposta.";
			
            if (!messageText) return;

            //Adiciona mensagem do usuário na tela
            messagesDiv.innerHTML += `<div class="message user">${messageText}</div>`;
            input.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            typingIndicator.style.display = 'block';

			// Adiciona a pergunta ao histórico local (formato do Worker: {role, text})
            // A data de hoje, a persona e as normas são injetadas pelo próprio Worker.
            chatHistory.push({ role: "user", text: messageText });

            try {
                // Chama o Worker (tati-proxy). O navegador manda só o histórico curto,
                // sem chave e sem as normas — por isso não estoura mais a cota (429).
                const response = await fetch(WORKER_URL.replace(/\/+$/, "") + "/gemini", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });

                const data = await response.json();

                let isError429 = false;
                let timerId = "";

                if (!response.ok || data.erro) {
                    console.error("ERRO API:", data.erro || data);

                    // Remove a última pergunta do histórico para não travar a conversa
                    chatHistory.pop();

                    if (response.status === 429 || data.codigo === 429) {
                        isError429 = true;
                        timerId = "timer-" + Date.now();
                        const espera = data.espera_segundos || 30;

                        botResponse = `⚠️ <b>Sobrecarga Tática!</b><br>
                                       Muitas solicitações em sequência.<br>
                                       Aguarde liberarmos o canal em: <b id="${timerId}" style="color:red; font-size:1.2em">${espera}</b> segundos.`;
                    } else {
                        botResponse = `Erro técnico: ${data.erro || ("HTTP " + response.status)}`;
                    }
                } else {
                    const texto = data.text || "(sem resposta)";

                    // Salva a resposta da IA no histórico (texto cru, sem HTML)
                    chatHistory.push({ role: "model", text: texto });

                    // Formatação para exibição
                    botResponse = marked.parse(texto);
                }

                // Adiciona a resposta na tela
                messagesDiv.innerHTML += `<div class="message bot">${botResponse}</div>`;

                // Dispara o contador se for erro 429
                if (isError429) {
                    iniciarContagem(timerId);
                }

            } catch (error) {
                console.error("ERRO JS:", error);
                chatHistory.pop(); // Remove a pergunta falha
                messagesDiv.innerHTML += `<div class="message bot" style="color:red">Erro de conexão com o assistente. Verifique o console.</div>`;
            }

			// --- Grava no Log ---
			logToGoogleSheets(messageText, botResponse);
			
            typingIndicator.style.display = 'none';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
